<!-- 压缩配置标签页 -->
<div class="tab-pane fade" id="compression" role="tabpanel" aria-labelledby="compression-tab">
    <div class="container-fluid py-4">
        <h5 class="mb-4">
            <i class="bi bi-archive me-2"></i>压缩配置
        </h5>

        <form id="compressionConfigForm">
            <div class="row">
                <div class="col-md-8">
                    <!-- 压缩方法选择 -->
                    <div class="mb-3">
                        <label for="compressionMethod" class="form-label">
                            压缩方法 <span class="text-danger">*</span>
                        </label>
                        <select class="form-select bg-dark text-light" id="compressionMethod" name="compression_method" required>
                            <option value="zstd">Zstandard (高压缩效率，推荐)</option>
                            <option value="pgzip">PGZip (多线程GZip)</option>
                            <option value="tar">tar (仅打包，不压缩)</option>
                        </select>
                        <small class="form-text text-muted">
                            推荐使用 Zstandard，压缩效率高、速度快。
                        </small>
                    </div>

                    <!-- PGZip线程数配置 -->
                    <div class="mb-3" id="compressionThreadsGroup" style="display: none;">
                        <label for="compressionThreads" class="form-label">
                            PGZip线程数
                        </label>
                        <input type="number" class="form-control bg-dark text-light" id="compressionThreads"
                               name="compression_threads" min="1" max="64" value="4">
                        <small class="form-text text-muted">
                            PGZip 压缩线程数，建议设置为CPU核心数。
                        </small>
                    </div>

                    <!-- zstd线程数 -->
                    <div class="mb-3" id="zstdThreadsGroup">
                        <label for="zstdThreads" class="form-label">
                            Zstandard线程数
                        </label>
                        <input type="number" class="form-control bg-dark text-light" id="zstdThreads"
                               name="zstd_threads" min="1" max="64" value="4">
                        <small class="form-text text-muted">
                            Zstandard 压缩线程数，建议设置为CPU核心数。
                        </small>
                    </div>

                    <!-- PGZip块大小 -->
                    <div class="mb-3" id="pgzipBlockSizeGroup" style="display: none;">
                        <label for="pgzipBlockSize" class="form-label">
                            PGZip块大小 <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <input type="text" class="form-control bg-dark text-light" id="pgzipBlockSize"
                                   name="pgzip_block_size" value="1M" placeholder="例如 1M、512M、1G">
                            <span class="input-group-text">默认 1M</span>
                        </div>
                        <small class="form-text text-muted">
                            控制PGZip的块大小，支持 K/M/G 单位。块越大压缩越快，压缩率略低。
                        </small>
                    </div>

                    <!-- 压缩级别 -->
                    <div class="mb-3">
                        <label for="compressionLevel" class="form-label">
                            压缩级别 <span class="text-danger">*</span>
                        </label>
                        <input type="range" class="form-range" id="compressionLevel" name="compression_level"
                               min="1" max="22" value="5" oninput="updateCompressionLevelDisplay(this.value, document.getElementById('compressionMethod')?.value || 'zstd')">
                        <div class="d-flex justify-content-between">
                            <small class="text-muted" id="compressionLevelMin">1 (最快)</small>
                            <small class="text-muted" id="compressionLevelDisplay">5 (平衡)</small>
                            <small class="text-muted" id="compressionLevelMax">22 (最高)</small>
                        </div>
                        <small class="form-text text-muted" id="compressionLevelHelp">
                            压缩级别：1=最快，5=平衡（推荐），10-15=高压缩，16-22=最高压缩（速度较慢）。
                        </small>
                    </div>

                    <!-- 直接压缩到磁带 -->
                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="compressDirectlyToTape"
                                   name="compress_directly_to_tape" checked>
                            <label class="form-check-label" for="compressDirectlyToTape">
                                直接压缩到磁带机
                            </label>
                        </div>
                        <small class="form-text text-muted">
                            启用后，压缩文件将直接写入磁带盘符，跳过 temp/final 目录。禁用后将使用原有流程（先压缩到临时目录，再移动到磁带机）。
                        </small>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="row mt-4">
                <div class="col-md-8">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="resetCompressionConfigBtn">
                        <i class="bi bi-arrow-counterclockwise me-2"></i>重置为默认值
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
// 显示消息函数
function showMessage(message, type) {
    type = type || 'info';
    const alertClass = type === 'success' ? 'alert-success' :
                      type === 'error' ? 'alert-danger' :
                      type === 'warning' ? 'alert-warning' : 'alert-info';

    const alertDiv = document.createElement('div');
    alertDiv.className = 'alert ' + alertClass + ' alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
    alertDiv.style.zIndex = '9999';

    const textNode = document.createTextNode(message + ' ');
    alertDiv.appendChild(textNode);

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'btn-close';
    closeBtn.setAttribute('data-bs-dismiss', 'alert');
    alertDiv.appendChild(closeBtn);

    document.body.appendChild(alertDiv);
    setTimeout(function() { alertDiv.remove(); }, 3000);
}

// 压缩级别配置
var compressionLevelConfigs = {
    'pgzip': { min: 0, max: 9, default: 5, help: '压缩级别：0=不压缩，1-3=快速，4-6=平衡（推荐5），7-9=最高压缩。' },
    'tar': { min: 0, max: 0, default: 0, help: 'tar仅打包，不压缩（级别固定为0）。' },
    'zstd': { min: 1, max: 22, default: 5, help: '压缩级别：1=最快，5=平衡（推荐），10-15=高压缩，16-22=最高压缩（速度较慢）。' }
};

function updateCompressionLevelRange(method) {
    var config = compressionLevelConfigs[method] || compressionLevelConfigs['zstd'];
    var levelInput = document.getElementById('compressionLevel');
    var levelMin = document.getElementById('compressionLevelMin');
    var levelMax = document.getElementById('compressionLevelMax');
    var levelHelp = document.getElementById('compressionLevelHelp');

    if (levelInput) {
        levelInput.min = config.min;
        levelInput.max = config.max;
        var currentValue = parseInt(levelInput.value);
        if (currentValue < config.min || currentValue > config.max) {
            levelInput.value = config.default;
        }
        updateCompressionLevelDisplay(levelInput.value, method);
    }
    if (levelMin) levelMin.textContent = config.min + ' (' + (method === 'zstd' ? '最快' : '不压缩') + ')';
    if (levelMax) levelMax.textContent = config.max + ' (最高)';
    if (levelHelp) levelHelp.textContent = config.help;
}

function updateCompressionLevelDisplay(value, method) {
    var display = document.getElementById('compressionLevelDisplay');
    var level = parseInt(value);
    var displayText = '';
    if (method === 'zstd') {
        if (level === 1) displayText = '1 (最快)';
        else if (level <= 4) displayText = level + ' (快速)';
        else if (level <= 9) displayText = level + ' (平衡)';
        else if (level <= 15) displayText = level + ' (高压缩)';
        else displayText = level + ' (最高)';
    } else if (method === 'tar') {
        displayText = '0 (仅打包)';
    } else {
        if (level === 0) displayText = '0 (不压缩)';
        else if (level <= 3) displayText = level + ' (快速)';
        else if (level <= 6) displayText = level + ' (平衡)';
        else displayText = level + ' (最高)';
    }
    if (display) display.textContent = displayText;
}

function updateCompressionMethodUI(method) {
    method = method || 'zstd';
    var threadsGroup = document.getElementById('compressionThreadsGroup');
    var pgzipBlockSizeGroup = document.getElementById('pgzipBlockSizeGroup');
    var zstdThreadsGroup = document.getElementById('zstdThreadsGroup');

    threadsGroup.style.display = method === 'pgzip' ? 'block' : 'none';
    pgzipBlockSizeGroup.style.display = method === 'pgzip' ? 'block' : 'none';
    zstdThreadsGroup.style.display = method === 'zstd' ? 'block' : 'none';
}

document.addEventListener('DOMContentLoaded', function() {
    var methodSelect = document.getElementById('compressionMethod');
    if (methodSelect) {
        updateCompressionLevelRange(methodSelect.value || 'zstd');
        methodSelect.addEventListener('change', function() {
            updateCompressionMethodUI(this.value);
            updateCompressionLevelRange(this.value);
        });
    }
    loadCompressionConfig();

    var resetBtn = document.getElementById('resetCompressionConfigBtn');
    if (resetBtn) {
        resetBtn.addEventListener('click', function() {
            if (confirm('确定要重置压缩配置为默认值吗？')) {
                resetCompressionConfig();
            }
        });
    }
});

async function loadCompressionConfig() {
    try {
        var response = await fetch('/api/system/compression');
        if (!response.ok) throw new Error('获取配置失败');
        var config = await response.json();

        var methodSelect = document.getElementById('compressionMethod');
        if (methodSelect) {
            var method = config.compression_method || 'zstd';
            methodSelect.value = method;
            updateCompressionMethodUI(method);
            updateCompressionLevelRange(method);
        }
        var threadsInput = document.getElementById('compressionThreads');
        if (threadsInput) {
            threadsInput.value = config.pgzip_threads ?? config.compression_threads ?? threadsInput.value;
        }
        if (config.compression_level !== undefined) {
            var method = config.compression_method || 'zstd';
            var levelInput = document.getElementById('compressionLevel');
            if (levelInput) {
                var cfg = compressionLevelConfigs[method] || compressionLevelConfigs['zstd'];
                levelInput.value = Math.max(cfg.min, Math.min(cfg.max, config.compression_level));
                updateCompressionLevelDisplay(levelInput.value, method);
            }
        }
        if (config.compress_directly_to_tape !== undefined) {
            document.getElementById('compressDirectlyToTape').checked = config.compress_directly_to_tape;
        }
        if (config.pgzip_block_size) {
            document.getElementById('pgzipBlockSize').value = config.pgzip_block_size;
        }
        if (config.zstd_threads !== undefined) {
            document.getElementById('zstdThreads').value = config.zstd_threads;
        }
    } catch (error) {
        console.error('加载压缩配置失败:', error);
        showMessage('加载压缩配置失败: ' + error.message, 'error');
    }
}

async function saveCompressionConfig(options) {
    options = options || {};
    var silent = options.silent || false;
    var reload = options.reload !== false;
    var form = document.getElementById('compressionConfigForm');
    var formData = new FormData(form);

    var config = {
        compression_method: formData.get('compression_method'),
        compression_threads: parseInt(formData.get('compression_threads')) || undefined,
        compression_level: parseInt(formData.get('compression_level')) || undefined,
        compress_directly_to_tape: document.getElementById('compressDirectlyToTape').checked,
        pgzip_block_size: formData.get('pgzip_block_size') || undefined,
        pgzip_threads: parseInt(formData.get('compression_threads')) || undefined,
        zstd_threads: parseInt(formData.get('zstd_threads')) || undefined,
    };

    try {
        var response = await fetch('/api/system/compression', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(config)
        });
        if (!response.ok) {
            var error = await response.json();
            throw new Error(error.detail || '保存失败');
        }
        await response.json();
        if (!silent) showMessage('压缩配置保存成功', 'success');
        if (reload) await loadCompressionConfig();
        return true;
    } catch (error) {
        console.error('保存压缩配置失败:', error);
        if (!silent) showMessage('保存压缩配置失败: ' + error.message, 'error');
        throw error;
    }
}

async function resetCompressionConfig() {
    try {
        var method = 'zstd';
        document.getElementById('compressionMethod').value = method;
        document.getElementById('compressionThreads').value = '4';
        document.getElementById('zstdThreads').value = '4';
        var cfg = compressionLevelConfigs[method];
        document.getElementById('compressionLevel').value = cfg.default;
        document.getElementById('pgzipBlockSize').value = '1G';
        document.getElementById('compressDirectlyToTape').checked = true;
        updateCompressionMethodUI(method);
        updateCompressionLevelRange(method);
        updateCompressionLevelDisplay(cfg.default, method);
        await saveCompressionConfig();
    } catch (error) {
        console.error('重置压缩配置失败:', error);
        showMessage('重置压缩配置失败: ' + error.message, 'error');
    }
}
</script>
