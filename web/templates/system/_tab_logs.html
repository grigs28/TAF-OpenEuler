<!-- 系统日志 -->
<div class="tab-pane fade" id="logs" role="tabpanel">
    <style>
        /* 日志列表样式：深底白字，左侧宽色条 */
        #logContainer .log-entry{background:rgba(255,255,255,0.05);color:#e6e8ef;border-radius:6px;overflow:hidden}
        #logContainer .log-entry .log-bar{width:10px;flex:0 0 10px}
        #logContainer .log-entry .content{padding:12px 14px}
        #logContainer .log-entry .content .content-line{font-size:1.05rem;line-height:1.6}
        #logContainer .log-entry .content .content-line .badge{font-size:0.95rem}
        #logContainer .log-entry .content .content-line .message{margin-left:8px;font-weight:500}
        /* 颜色条按级别 */
        #logContainer .bar-debug{background:#6c757d}
        #logContainer .bar-info{background:#17a2b8}
        #logContainer .bar-warning{background:#ffc107}
        #logContainer .bar-error{background:#dc3545}
        #logContainer .bar-critical{background:#8b0000}
    </style>
    <div class="row">
        <div class="col-12">
            <div class="setting-card service-card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="card-title mb-0">系统日志</h6>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-secondary small">日志级别</span>
                            <div class="btn-group btn-group-sm" id="logLevelToggle">
                                <button class="btn btn-outline-secondary" data-level="DEBUG">DEBUG</button>
                                <button class="btn btn-outline-info active" data-level="INFO">INFO</button>
                                <button class="btn btn-outline-warning" data-level="WARNING">WARNING</button>
                                <button class="btn btn-outline-danger" data-level="ERROR">ERROR</button>
                            </div>
                            <button class="btn btn-outline-secondary btn-sm" id="exportLogsBtn" title="导出Excel">
                                <i class="bi bi-download me-1"></i>导出
                            </button>
                        </div>
                    </div>
                    
                    <!-- 筛选条件 -->
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label small">分类</label>
                            <select class="form-select form-select-sm bg-dark text-light" id="logCategory">
                                <option value="">所有分类</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small">级别</label>
                            <select class="form-select form-select-sm bg-dark text-light" id="logLevel">
                                <option value="">所有级别</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small">操作类型</label>
                            <select class="form-select form-select-sm bg-dark text-light" id="logOperationType">
                                <option value="">所有操作</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small">操作</label>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-secondary btn-sm flex-fill" id="refreshLogsBtn">
                                    <i class="bi bi-arrow-clockwise me-1"></i>刷新
                                </button>
                                <button class="btn btn-outline-secondary btn-sm flex-fill" id="clearLogsBtn">
                                    <i class="bi bi-trash me-1"></i>清空
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 日志列表 -->
                    <div class="log-container" id="logContainer" style="height: 500px; overflow-y: auto; background: rgba(20, 30, 48, 0.6); padding: 10px; border-radius: 4px;">
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-hourglass-split me-2"></i>加载中...
                        </div>
                    </div>
                    
                    <!-- 分页 -->
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-muted small">每页</span>
                            <select class="form-select form-select-sm" id="logPageSize" style="width: auto; min-width: 80px;">
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="50" selected>50</option>
                                <option value="100">100</option>
                                <option value="500">500</option>
                            </select>
                            <span class="text-muted small">条</span>
                            <span class="text-muted small ms-2" id="logPaginationInfo">显示 0-0 条，共 0 条</span>
                        </div>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary" id="logPrevPage" disabled>
                                <i class="bi bi-chevron-left"></i>上一页
                            </button>
                            <button class="btn btn-outline-secondary" id="logNextPage" disabled>
                                下一页<i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
