<!-- 备份策略 -->
<div class="tab-pane fade" id="backup" role="tabpanel">
    <div class="row">
        <div class="col-md-6">
            <div class="setting-card service-card mb-3">
                <div class="card-body">
                    <h6 class="card-title">压缩设置</h6>
                    <div class="mb-3">
                        <label class="form-label">最大文件大小 (GB)</label>
                        <input type="number" class="form-control" id="maxFileSizeGB" value="3" min="1" step="0.1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">后台扫描进度更新间隔（文件数）</label>
                        <input type="number" class="form-control" id="scanUpdateInterval" value="500" min="1" step="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">后台扫描进度统计间隔（秒）</label>
                        <input type="number" class="form-control" id="scanLogIntervalSeconds" value="60" min="1" step="1">
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="scanMemoryOnly">
                        <label class="form-check-label" for="scanMemoryOnly">纯内存扫描模式</label>
                        <small class="text-muted d-block">启用后扫描器仅写入内存，减少扫描阶段数据库I/O，崩溃时无孤儿记录</small>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="useCheckpoint">
                        <label class="form-check-label" for="useCheckpoint">启用检查点文件</label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">压缩临时目录</label>
                        <input type="text" class="form-control" id="backupCompressDir" value="temp/compress">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">压缩并行批次数量</label>
                        <input type="number" class="form-control" id="compressionParallelBatches" value="3" min="1" step="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">扫描时减少批次数</label>
                        <input type="number" class="form-control" id="compressionBatchesReduction" value="1" min="0" step="1">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">

            <div class="setting-card service-card mb-3">
                <div class="card-body">
                    <h6 class="card-title">
                        <i class="bi bi-hdd me-2"></i>磁带与设备配置
                    </h6>
                    <div class="mb-3">
                        <label class="form-label">默认保留月数</label>
                        <input type="number" class="form-control" id="defaultRetentionMonths" value="6" min="1" max="36">
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="autoEraseExpired">
                        <label class="form-check-label" for="autoEraseExpired">自动擦除过期磁带</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="enableTapeFormatBeforeFull">
                        <label class="form-check-label" for="enableTapeFormatBeforeFull">
                            完整备份前自动格式化磁带
                        </label>
                        <small class="text-muted d-block">开启后自动调用 <code>mkltfs</code> 格式化磁带并生成新卷标，关闭后仅校验卷标</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">磁带设备路径（mt命令）</label>
                        <input type="text" class="form-control" id="itdtDevicePath"
                               placeholder="/dev/nst0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">LTFS SCSI 设备路径</label>
                        <input type="text" class="form-control" id="ltfsDevicePath"
                               placeholder="/dev/sg2">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">LTFS工具目录</label>
                        <input type="text" class="form-control" id="ltfsToolsDir"
                               placeholder="/usr/local/ltfs">
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
